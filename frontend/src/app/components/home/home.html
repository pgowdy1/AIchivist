<div class="app-layout">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <h1 class="header-title">
          AIchivist
          @if (isMockMode) {
            <span class="mock-badge">MOCK</span>
          }
        </h1>
        <p class="header-subtitle">Washington State University Archival Collections</p>
      </div>
      <button
        type="button"
        class="header-settings-btn"
        (click)="showSettings.set(true)"
        aria-label="Settings"
        title="Settings"
      >
        <svg class="header-settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="search-section">
      <app-search-bar [loading]="loading()" (searchTriggered)="onSearch($event)" />
    </div>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    @if (searchResponse()) {
      <div class="results-section">
        <div class="results-main">
          <app-results-panel
            [results]="searchResponse()!.results"
            [additionalResults]="searchResponse()!.additionalResults ?? []"
            [query]="searchResponse()!.query"
            [cached]="searchResponse()!.cached"
          />
        </div>
        <aside class="chat-aside">
          <app-chat-sidebar
            [contextId]="searchResponse()!.contextId"
            [visible]="searchResponse()!.results.length > 0"
          />
        </aside>
      </div>
    }
  </main>
</div>

@if (showSettings()) {
  <app-settings-dialog (closed)="showSettings.set(false)" />
}
